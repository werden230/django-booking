services:
  django-booking:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: django-booking
    container_name: django-booking
    restart: always
    command: "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    networks:
      - dbnet
    ports:
      - "8000:8000"
    depends_on:
      - migrate
  
  migrate:
    image: django-booking
    command: python manage.py migrate
    env_file:
     - .env
    networks:
     - dbnet
    depends_on:
     - postgres
  
  postgres:
    image: postgres:17-alpine
    container_name: psgr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    networks:
      - dbnet

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data: