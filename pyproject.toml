[project]
name = "django-booking"
version = "0.1.0"
description = ""
authors = [
    {name = "werden230",email = "rischicovec@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "psycopg (>=3.3.6,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "django-stubs (>=6.1.2,<7.0.0)",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main", "pydantic.mypy"]
strict=true
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "booking.settings"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__",
"migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true